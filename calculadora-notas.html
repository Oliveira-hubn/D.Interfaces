<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de notas - média das três avaliações do semestre">
    <title>Calculadora de notas - Kauê Rodrigues de Oliveira Rocha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1220;
            --panel: #131c2e;
            --panel-alt: #1a2438;
            --text: #eef2f8;
            --muted: #8b96ab;
            --border: rgba(238, 242, 248, 0.08);
            --cyan: #22d3ee;
            --green: #34d399;
            --amber: #f5b342;
            --sans: "Inter", "Segoe UI", sans-serif;
            --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
        }

        * { box-sizing: border-box; }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            line-height: 1.6;
            min-height: 100vh;
        }

        a { color: var(--cyan); }
        :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

        .top-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
            max-width: 620px;
            margin: 0 auto;
            padding: 1.4rem 1.5rem 0.6rem;
            font-family: var(--mono);
            font-size: 0.85rem;
        }

        .top-nav a { color: var(--muted); text-decoration: none; }
        .top-nav a:hover { color: var(--text); }

        main { max-width: 620px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 2rem;
            animation: rise 0.6s ease both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card h1 { margin: 0 0 0.3rem; font-size: 1.5rem; font-weight: 700; }
        .card p.lead { margin: 0 0 1.8rem; color: var(--muted); font-size: 0.9rem; }

        .inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.9rem;
            margin-bottom: 1.8rem;
        }

        @media (max-width: 480px) { .inputs { grid-template-columns: 1fr; } }

        label {
            display: block;
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
            font-family: var(--mono);
        }

        input[type="number"] {
            width: 100%;
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.7rem 0.8rem;
            color: var(--text);
            font-size: 1.1rem;
            font-family: var(--sans);
        }

        input[type="number"]:focus { border-color: var(--cyan); }

        .result {
            background: var(--panel-alt);
            border-left: 4px solid var(--cyan);
            border-radius: 10px;
            padding: 1.3rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            transition: border-color 0.2s ease;
        }

        .result.reprovado { border-left-color: var(--amber); }

        .result-label { font-size: 0.82rem; color: var(--muted); font-family: var(--mono); margin: 0 0 0.2rem; }
        .result-value { font-size: 2.4rem; font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }

        .status-pill {
            font-family: var(--mono);
            font-size: 0.85rem;
            border: 1px solid var(--green);
            color: var(--green);
            border-radius: 999px;
            padding: 0.4rem 1rem;
            white-space: nowrap;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .status-pill.reprovado { border-color: var(--amber); color: var(--amber); }

        .note { margin-top: 1.2rem; font-size: 0.78rem; color: var(--muted); }

        footer {
            max-width: 620px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
            color: var(--muted);
            font-size: 0.82rem;
            font-family: var(--mono);
        }

        footer a { color: var(--muted); }
        footer a:hover { color: var(--text); }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="./portifolio_03_09.html">&larr; Voltar ao portifólio</a>
        <a href="./agenda.html">Agenda da turma &rarr;</a>
    </nav>

    <main>
        <div class="card">
            <h1>Calculadora de notas</h1>
            <p class="lead">Média das três avaliações do semestre</p>

            <div class="inputs">
                <div>
                    <label for="nota1">Nota 1</label>
                    <input type="number" id="nota1" value="8.0" min="0" max="10" step="0.1">
                </div>
                <div>
                    <label for="nota2">Nota 2</label>
                    <input type="number" id="nota2" value="6.5" min="0" max="10" step="0.1">
                </div>
                <div>
                    <label for="nota3">Nota 3</label>
                    <input type="number" id="nota3" value="7.5" min="0" max="10" step="0.1">
                </div>
            </div>

            <div class="result" id="result">
                <div>
                    <p class="result-label">Média</p>
                    <p class="result-value" id="media">7,3</p>
                </div>
                <span class="status-pill" id="status">aprovado</span>
            </div>

            <p class="note">Considera-se aprovado quem atinge média igual ou superior a 6,0.</p>
        </div>
    </main>

    <footer>
        <span>Projeto de estudo - CEUB</span>
    </footer>

    <script>
        const nota1 = document.getElementById('nota1');
        const nota2 = document.getElementById('nota2');
        const nota3 = document.getElementById('nota3');
        const mediaEl = document.getElementById('media');
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');

        function clamp(value) {
            if (isNaN(value)) return 0;
            return Math.min(10, Math.max(0, value));
        }

        function atualizar() {
            const n1 = clamp(parseFloat(nota1.value));
            const n2 = clamp(parseFloat(nota2.value));
            const n3 = clamp(parseFloat(nota3.value));
            const media = (n1 + n2 + n3) / 3;
            const mediaFormatada = media.toFixed(1).replace('.', ',');

            mediaEl.textContent = mediaFormatada;

            const aprovado = media >= 6;
            statusEl.textContent = aprovado ? 'aprovado' : 'reprovado';
            statusEl.classList.toggle('reprovado', !aprovado);
            resultEl.classList.toggle('reprovado', !aprovado);
        }

        [nota1, nota2, nota3].forEach((input) => {
            input.addEventListener('input', atualizar);
        });

        atualizar();
    </script>
</body>
</html>
